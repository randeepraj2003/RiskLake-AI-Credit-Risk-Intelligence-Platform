name: RiskLake CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── 1. Python lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check . --ignore E501,E402

  # ── 2. Unit tests (mock DB + Redis) ────────────────────────────────────────
  test:
    name: API Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       risklake
          POSTGRES_USER:     risklake
          POSTGRES_PASSWORD: risklake
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r ml/requirements.txt
          pip install fastapi uvicorn[standard] httpx pytest pytest-asyncio

      - name: Init DB schemas
        env:
          PGPASSWORD: risklake
        run: psql -h localhost -U risklake -d risklake -f scripts/init_db.sql

      - name: Run pytest
        env:
          PG_HOST:     localhost
          PG_PORT:     5432
          PG_DB:       risklake
          PG_USER:     risklake
          PG_PASSWORD: risklake
          REDIS_URL:   redis://localhost:6379/0
          GEMINI_API_KEY: ""          # not needed for unit tests (mocked)
        run: pytest api/tests/ -v --tb=short

  # ── 3. dbt tests ────────────────────────────────────────────────────────────
  dbt:
    name: dbt Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       risklake
          POSTGRES_USER:     risklake
          POSTGRES_PASSWORD: risklake
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: pip install dbt-core dbt-postgres

      - name: Init DB schemas
        env:
          PGPASSWORD: risklake
        run: psql -h localhost -U risklake -d risklake -f scripts/init_db.sql

      - name: Generate mock data + seed Bronze tables
        env:
          PG_HOST:     localhost
          PG_PORT:     5432
          PG_DB:       risklake
          PG_USER:     risklake
          PG_PASSWORD: risklake
        run: |
          pip install pandas numpy pyarrow psycopg2-binary
          python generate_mock_data.py
          python -c "
          import pandas as pd, psycopg2, os
          conn = psycopg2.connect(host='localhost',dbname='risklake',user='risklake',password='risklake')
          for tbl in ['loan_applications','credit_bureau','transactions','macro_indicators']:
              df = pd.read_csv(f'data/raw/{tbl}.csv')
              df['_bronze_ingested_at']    = '2024-01-01'
              df['_bronze_source_file']    = f'data/raw/{tbl}.csv'
              df['_bronze_execution_date'] = '2024-01-01'
              df.head(0).to_sql(tbl, conn, schema='bronze', if_exists='replace', index=False)
              from sqlalchemy import create_engine
              engine = create_engine('postgresql+psycopg2://risklake:risklake@localhost/risklake')
              df.to_sql(tbl, engine, schema='bronze', if_exists='replace', index=False)
          "

      - name: dbt run (Silver models)
        working-directory: dbt
        env:
          PG_HOST:     localhost
          PG_PORT:     "5432"
          PG_DB:       risklake
          PG_USER:     risklake
          PG_PASSWORD: risklake
        run: |
          dbt deps
          dbt run  --select tag:silver
          dbt test --select tag:silver

  # ── 4. Docker build check ───────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t risklake-api:ci .

      - name: Build Frontend image
        run: docker build -f frontend/Dockerfile.frontend -t risklake-frontend:ci ./frontend
